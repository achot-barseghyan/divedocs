<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="724" viewBox="0 0 760 724" font-family="'Familjen Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>La courbe de sécurité</title>
  <style>
    .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .curve { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s ease-in-out forwards; }
    .area { animation: fadein 1.2s ease-out .4s both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: popin .35s ease-out both; }
    .cyc { animation: cycle 26s linear infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popin { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes cycle { 0%, 7.6% { opacity: 1; } 7.7%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .curve { animation: none; stroke-dashoffset: 0; }
      .area, .pop { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a3d"/>
      <stop offset="0.45" stop-color="#081c2a"/>
      <stop offset="1" stop-color="#05111a"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="40" y="150" width="680" height="517" rx="18"/></clipPath>
  </defs>

  <rect width="760" height="724" fill="url(#bg)"/>

